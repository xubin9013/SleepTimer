<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SleepTimer 通知</title>
    <style>
      :root {
        --card-bg: rgba(22, 24, 32, 0.96);
        --card-color: #f3f4f6;
        --card-border: rgba(255, 255, 255, 0.08);
        --title-color: rgba(255, 255, 255, 0.55);
        --line-color: rgba(255, 255, 255, 0.82);
        --close-color: rgba(255, 255, 255, 0.45);
        --bg: transparent;
      }
      html[data-theme="light"] {
        --card-bg: #ffffff;
        --card-color: #111827;
        --card-border: rgba(0, 0, 0, 0.08);
        --title-color: rgba(0, 0, 0, 0.5);
        --line-color: rgba(0, 0, 0, 0.78);
        --close-color: rgba(0, 0, 0, 0.4);
        --bg: transparent;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #nt-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: transparent;
      }
      #nt-card {
        width: 320px;
        padding: 14px 16px;
        border-radius: 16px;
        background: var(--card-bg);
        color: var(--card-color);
        border: 1px solid var(--card-border);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
        display: flex;
        gap: 12px;
        align-items: flex-start;
        animation: nt-slide 220ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #nt-icon {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
      }
      #nt-icon svg { width: 20px; height: 20px; }
      #nt-icon.info { color: #8b7ff0; background: rgba(139, 127, 240, 0.14); }
      #nt-icon.success { color: #22c55e; background: rgba(34, 197, 94, 0.14); }
      #nt-icon.update { color: #8b7ff0; background: rgba(139, 127, 240, 0.14); }
      #nt-icon.warn { color: #f59e0b; background: rgba(245, 158, 11, 0.14); }
      #nt-main { flex: 1 1 auto; min-width: 0; }
      #nt-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #nt-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--title-color);
        letter-spacing: 0.2px;
      }
      #nt-close {
        background: none;
        border: none;
        color: var(--close-color);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
        transition: color 0.15s ease;
      }
      #nt-close:hover { color: var(--card-color); }
      #nt-lines {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .nt-line {
        font-size: 12.5px;
        color: var(--line-color);
        line-height: 1.45;
        word-break: break-word;
      }
      @keyframes nt-slide {
        from { transform: translateX(24px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="nt-root">
      <div id="nt-card">
        <div id="nt-icon"></div>
        <div id="nt-main">
          <div id="nt-head">
            <div id="nt-title"></div>
            <button id="nt-close" aria-label="关闭" type="button">×</button>
          </div>
          <div id="nt-lines"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/notify-page.ts"></script>
  </body>
</html>
